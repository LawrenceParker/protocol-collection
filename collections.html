<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections - Protocol Collection</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="collections.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <h1>Collections</h1>
    <p class="subtitle">Spend Collection Credits to open a collection of player cards.</p>

    <p id="error" class="error hidden"></p>
    <p id="login-note" class="empty hidden">Log in with Discord using the button in the top right to open collections.</p>

    <div id="content" class="hidden">
      <div id="packs" class="packs"></div>

      <div id="results" class="hidden">
        <h2 id="results-title">You opened</h2>
        <div id="cards" class="cards"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    const errorBox = document.getElementById("error");
    let rarities = {};

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function fmtDate(d) {
      return new Date(d).toLocaleString([], {
        weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      });
    }

    function packTile(c) {
      const item = el("div", "pack-item");

      const tile = el("div", "tile");
      if (c.colour) tile.style.setProperty("--tile-colour", c.colour);

      const top = el("div");
      top.appendChild(el("h3", "name", c.name));
      if (c.description) top.appendChild(el("p", "desc", c.description));
      tile.appendChild(top);

      const info = el("div", "info");
      info.appendChild(el("span", "price", c.price + " credits"));
      info.appendChild(el("span", "count", c.cards_per_pack + " cards"));
      if (c.ends_at) info.appendChild(el("span", "limited", "Limited time. Ends " + fmtDate(c.ends_at)));
      tile.appendChild(info);
      item.appendChild(tile);

      const btn = el("button", null, "Open collection");
      if (Nav.credits < c.price) {
        btn.disabled = true;
        btn.textContent = "Not enough credits";
      }
      btn.addEventListener("click", () => openPack(c, btn));
      item.appendChild(btn);
      return item;
    }

    function playerCard(p) {
      const r = rarities[p.event] || {};
      const card = el("div", "player-card");
      if (r.colour) card.style.borderColor = r.colour;
      card.appendChild(el("div", "rarity", p.event + " " + p.year));
      card.appendChild(el("div", "name", p.player));
      card.appendChild(el("div", "sub", [p.team, p.role].filter(Boolean).join(" | ")));
      return card;
    }

    async function openPack(c, btn) {
      btn.disabled = true;
      errorBox.classList.add("hidden");
      const { data, error } = await db.rpc("open_collection", { p_name: c.name });
      if (error) {
        showError(error.message);
        btn.disabled = false;
        return;
      }
      document.getElementById("results-title").textContent = "You opened " + c.name;
      document.getElementById("cards").replaceChildren(...data.map(playerCard));
      document.getElementById("results").classList.remove("hidden");
      await Nav.refreshCredits();   // updates the credits in the navbar
      await load();
    }

    async function load() {
      const [colRes, rarRes] = await Promise.all([
        db.from("collections").select("*").eq("active", true).order("sort_order"),
        db.from("event_rarities").select("event, colour")
      ]);

      if (colRes.error) { showError("Could not load collections: " + colRes.error.message); return; }

      rarities = {};
      (rarRes.data || []).forEach(r => { rarities[r.event] = r; });

      const now = new Date();
      const open = colRes.data.filter(c =>
        (!c.starts_at || new Date(c.starts_at) <= now) &&
        (!c.ends_at || new Date(c.ends_at) > now)
      );

      const box = document.getElementById("packs");
      box.replaceChildren();
      if (open.length === 0) {
        box.appendChild(el("p", "empty", "No collections are open right now."));
      } else {
        open.forEach(c => box.appendChild(packTile(c)));
      }
    }

    Nav.init().then(user => {
      if (!user) {
        document.getElementById("login-note").classList.remove("hidden");
        return;
      }
      document.getElementById("content").classList.remove("hidden");
      load();
    });
  </script>
</body>
</html>
