<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol Collection</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="page-center">
    <section class="card">
      <h1>Protocol Collection</h1>
      <p id="intro">Predict VCT match winners, earn Collection Credits and open Collections of pro player cards.</p>
      <div id="actions" class="button-row"></div>
      <p id="error" class="error hidden"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    function link(href, label, secondary) {
      const a = document.createElement("a");
      a.href = href;
      a.textContent = label;
      a.className = "button" + (secondary ? " secondary" : "");
      return a;
    }

    Nav.init().then(user => {
      const actions = document.getElementById("actions");
      if (user) {
        const name = (Nav.profile && Nav.profile.username) || "Player";
        document.getElementById("intro").textContent = "Welcome back, " + name + ".";
        actions.appendChild(link("predictions.html", "Predictions"));
        actions.appendChild(link("collections.html", "Collections", true));
      } else {
        const btn = document.createElement("button");
        btn.textContent = "Log in with Discord";
        btn.addEventListener("click", () => Nav.login());
        actions.appendChild(btn);
      }
    });
  </script>
</body>
</html>
