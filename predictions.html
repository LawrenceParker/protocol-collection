<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predictions - Protocol Collection</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="predictions.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="page">
    <h1>Predictions</h1>
    <p class="subtitle">Pick the winner of each match. Correct picks earn the reward shown on the match.</p>

    <p id="error" class="error hidden"></p>
    <p id="login-note" class="empty hidden">Log in with Discord using the button in the top right to make predictions.</p>

    <div id="content" class="hidden">
      <h2>Upcoming</h2>
      <div id="upcoming" class="grid"></div>
      <h2>Started</h2>
      <div id="started" class="grid"></div>
      <h2>Finished</h2>
      <div id="finished" class="grid"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    const errorBox = document.getElementById("error");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    async function pick(matchId, team) {
      const { error } = await db.rpc("make_prediction", { p_match_id: matchId, p_pick: team });
      if (error) { showError(error.message); return; }
      errorBox.classList.add("hidden");
      load();
    }

    function teamButton(match, team, myPick, state) {
      const b = el("button", "team-btn");
      b.appendChild(document.createTextNode(team));
      if (myPick === team) {
        b.classList.add("picked");
        b.appendChild(el("span", "tag", "Your pick"));
      }
      if (state === "upcoming") {
        b.addEventListener("click", () => pick(match.id, team));
      } else {
        b.disabled = true;
        if (state === "finished") b.classList.add(team === match.winner ? "win" : "lose");
      }
      return b;
    }

    function statusLine(match, myPick, state) {
      const s = el("div", "status");
      if (state === "upcoming") {
        s.textContent = myPick
          ? "Your pick: " + myPick + ". You can change it until the match starts."
          : "No pick yet.";
      } else if (state === "started") {
        s.textContent = myPick
          ? "Your pick: " + myPick + ". Locked in, waiting for the result."
          : "You did not pick this match.";
      } else {
        if (!myPick) {
          s.textContent = "You did not pick this match. Winner: " + match.winner + ".";
        } else if (myPick === match.winner) {
          s.textContent = "Correct. You picked " + myPick + " and earned " + match.reward + " credits.";
          s.classList.add("ok");
        } else {
          s.textContent = "Incorrect. You picked " + myPick + ", winner was " + match.winner + ".";
          s.classList.add("bad");
        }
      }
      return s;
    }

    function matchCard(match, myPick, state) {
      const card = el("div", "match");

      const top = el("div", "top");
      const meta = el("div", "meta");
      meta.appendChild(el("span", "event", [match.event, match.stage].filter(Boolean).join(" - ")));
      meta.appendChild(document.createTextNode(new Date(match.start_time).toLocaleString([], {
        weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      })));
      top.appendChild(meta);

      const badge = el("div", "reward-badge");
      badge.appendChild(el("strong", null, "+" + match.reward));
      badge.appendChild(el("span", null, "credits"));
      top.appendChild(badge);
      card.appendChild(top);

      const teams = el("div", "teams");
      teams.appendChild(teamButton(match, match.team_a, myPick, state));
      teams.appendChild(teamButton(match, match.team_b, myPick, state));
      card.appendChild(teams);

      card.appendChild(statusLine(match, myPick, state));
      return card;
    }

    function fill(id, cards) {
      const box = document.getElementById(id);
      box.replaceChildren();
      if (cards.length === 0) {
        box.appendChild(el("p", "empty", "Nothing here yet."));
      } else {
        cards.forEach(c => box.appendChild(c));
      }
    }

    async function load() {
      const [matchesRes, predsRes] = await Promise.all([
        db.from("matches").select("*").order("start_time", { ascending: true }),
        db.from("predictions").select("match_id, pick")
      ]);

      if (matchesRes.error) { showError("Could not load matches: " + matchesRes.error.message); return; }

      const picks = {};
      (predsRes.data || []).forEach(p => { picks[p.match_id] = p.pick; });

      const now = new Date();
      const upcoming = [], started = [], finished = [];

      matchesRes.data.forEach(m => {
        if (m.winner) finished.push(matchCard(m, picks[m.id], "finished"));
        else if (new Date(m.start_time) <= now) started.push(matchCard(m, picks[m.id], "started"));
        else upcoming.push(matchCard(m, picks[m.id], "upcoming"));
      });

      finished.reverse(); // newest result first
      fill("upcoming", upcoming);
      fill("started", started);
      fill("finished", finished);
    }

    Nav.init().then(user => {
      if (!user) {
        document.getElementById("login-note").classList.remove("hidden");
        return;
      }
      document.getElementById("content").classList.remove("hidden");
      load();
    });
  </script>
</body>
</html>
